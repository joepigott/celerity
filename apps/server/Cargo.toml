[package]
name = "celerityd"
authors = ["Joe Pigott <joe@joepigott.dev>"]
description = "A server for `celerity`, the smart todo list"
license = "GPL-3.0-only"
repository = "https://github.com/joepigott/celerityd"
version = "0.4.0"
edition = "2021"

[dependencies]
celerity = { path = "../../packages/core" }
tokio = { version = "1.43.0", features = ["macros", "rt", "rt-multi-thread", "signal"] }
serde = { version = "1.0.217", features = ["serde_derive"] }
serde_json = "1.0.137"
toml = "0.9.4"
log = "0.4.34"
env_logger = "0.11.11"

[features]
https = ["celerity/https"]
