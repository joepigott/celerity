[package]
name = "celerity"
authors = ["Joe Pigott <joe@joepigott.dev>"]
description = "A smart todo list that applies CPU scheduling logic to organize your tasks"
version = "0.4.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.39", features = ["serde"] }
serde = { version = "1.0.217", features = ["serde_derive"] }
typetag = "0.2.19"
warp = { version = "0.3.7" }
serde_json = "1.0.137"
log = "0.4.34"

[features]
https = ["warp/tls"]
